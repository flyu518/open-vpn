name: 发布 macOS 安装包

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "要构建的既有标签版本；必须与 project-config.json 一致"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: 构建 macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: macos-15-intel
            brew_prefix: /usr/local
          - arch: arm64
            runner: macos-14
            brew_prefix: /opt/homebrew
    runs-on: ${{ matrix.runner }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      OPENVPN_MANUAL_VERSION: ${{ inputs.version }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: 计算版本号
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${OPENVPN_MANUAL_VERSION:-}"
          fi
          args=(-DOPENVPN_CONFIG_KEY=version)
          if [ -n "$version" ]; then
            args+=("-DOPENVPN_EXPECTED_VERSION=$version")
          fi
          version=$(cmake "${args[@]}" -P cmake/ProjectConfig.cmake)
          echo "OPENVPN_RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "OPENVPN_CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 安装 macOS 构建依赖
        run: brew install asio fmt jsoncpp lz4 openssl xxhash

      - name: 校验 runner 架构
        shell: bash
        run: |
          actual=$(uname -m)
          expected="${{ matrix.arch }}"
          if [ "$actual" != "$expected" ]; then
            echo "runner 架构不匹配：期望 $expected，实际 $actual" >&2
            exit 1
          fi

      - name: 拉取锁定的 OpenVPN3 源码
        shell: bash
        run: |
          repository=$(python3 -c 'import json; print(json.load(open("third_party/openvpn3.lock"))["repository"])')
          commit=$(python3 -c 'import json; print(json.load(open("third_party/openvpn3.lock"))["commit"])')
          git clone --filter=blob:none "$repository" third_party/openvpn3
          git -C third_party/openvpn3 checkout --detach "$commit"
          test "$(git -C third_party/openvpn3 rev-parse HEAD)" = "$commit"

      - name: 安装 Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.12.0"
          host: mac
          target: desktop
          arch: clang_64
          cache: true

      - name: 构建并验证安装包
        shell: bash
        run: |
          export OPENVPN_CMAKE="$(command -v cmake)"
          release_dir="$RUNNER_TEMP/openvpn-release-${{ matrix.arch }}"
          packaging/macos/build-release.sh \
            "$QT_ROOT_DIR" \
            "$release_dir" \
            "$OPENVPN_RELEASE_VERSION" \
            "$(brew --prefix xxhash)" \
            "${{ matrix.arch }}" \
            "${{ matrix.brew_prefix }}"
          package="$release_dir/OpenVPN-$OPENVPN_RELEASE_VERSION-macos-${{ matrix.arch }}.pkg"
          cp "$package" "OpenVPN-$OPENVPN_RELEASE_VERSION-macos-${{ matrix.arch }}.pkg"
          shasum -a 256 "OpenVPN-$OPENVPN_RELEASE_VERSION-macos-${{ matrix.arch }}.pkg" \
            | tee "OpenVPN-$OPENVPN_RELEASE_VERSION-macos-${{ matrix.arch }}.pkg.sha256"

      - name: 上传构建资产
        uses: actions/upload-artifact@v4
        with:
          name: openvpn-macos-${{ matrix.arch }}-${{ env.OPENVPN_RELEASE_VERSION }}-${{ env.OPENVPN_CANDIDATE_SHA }}
          path: |
            OpenVPN-${{ env.OPENVPN_RELEASE_VERSION }}-macos-${{ matrix.arch }}.pkg
            OpenVPN-${{ env.OPENVPN_RELEASE_VERSION }}-macos-${{ matrix.arch }}.pkg.sha256
